[build-system]
requires = ['setuptools>=68', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'predictive-maintenance'
version = '0.1.0'
description = 'Predictive maintenance platform for RUL prediction.'
readme = 'README.md'
requires-python = '>=3.11'
dependencies = [
    'pandas',
    'numpy',
    'scikit-learn',
    'lightgbm',
    'shap',
    'evidently',
    'mlflow>=2.9,<4',
    'fastapi',
    'uvicorn',
    'sqlalchemy',
    'streamlit',
    'joblib',
    'matplotlib',
]

[project.optional-dependencies]
dev = ['ruff', 'mypy', 'pytest', 'ipykernel']
postgres = ['psycopg[binary]']

[tool.setuptools.packages.find]
where = ['src']

[tool.ruff]
line-length = 100
target-version = 'py311'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B']

[tool.mypy]
python_version = '3.11'
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['src']
